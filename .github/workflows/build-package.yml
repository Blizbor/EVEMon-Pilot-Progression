name: Build EVEMon package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package ZIP
        run: |
          mkdir -p dist
          cd package
          zip -r ../dist/EvE-Pilot-Progression-EVEMon.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: EvE-Pilot-Progression-EVEMon-package
          path: dist/EvE-Pilot-Progression-EVEMon.zip
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/EvE-Pilot-Progression-EVEMon.zip --generate-notes --title "${{ github.ref_name }}"
